<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UPPCS 2026 Polity — Union and its territory</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<div class="container">
  <header>
    <h1>UPPCS 2026 Polity — Union and its territory</h1>
    <div class="sub">Bilingual Indian Polity  |  Chapter-wise Sections  |  One question at a time</div>
  </header>

  <div class="controls">
    <button id="btnAll" class="active">All Sections</button>
    <button id="btnReset">Reset Progress</button>
  </div>
  <div class="controls section-list" id="sectionButtons"></div>
  <div class="lang-toggle">
    <button id="langBoth" class="active">Both</button>
    <button id="langEn">English</button>
    <button id="langHi">हिन्दी</button>
  </div>

  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-text">
      <span id="qCounter">Question <span id="curQ">1</span> of <span id="totQ">10</span></span>
      <span id="scoreDisplay">Score: 0</span>
    </div>
  </div>

  <div class="question-card" id="quizArea">
    <div class="q-section" id="qSection"></div>
    <div class="q-number" id="qNumber"></div>
    <div id="arHeader" class="hide"></div>
    <div class="q-en" id="qEn"></div>
    <div class="q-hi" id="qHi"></div>
    <div class="options" id="optionsArea"></div>
    <div class="feedback" id="feedback">
      <h4 id="fbTitle"></h4>
      <div class="tag" id="fbTag"></div>
      <p id="fbEn"></p>
      <p id="fbHi"></p>
      <div class="ref" id="fbRef"></div>
    </div>
    <button class="btn-next" id="btnNext" disabled>Next Question</button>
  </div>

  <div class="result-card hide" id="resultArea">
    <div class="score-big" id="finalScore">0 / 10</div>
    <div class="result-msg" id="finalMsg"></div>
    <div class="weak-list">
      <h4>Weak Topics &amp; Revision</h4>
      <ul id="weakList"></ul>
    </div>
    <button class="btn-restart" onclick="restartTest()">Restart Test</button>
  </div>
</div>

<script>const Q = [
  {"id": "POL-012", "section": "Union and its territory", "sub": "Money Bill", "type": "mcq_single", "qEn": "The Money Bill is defined in which Article of the Constitution of India?", "qHi": "भारत के संविधान के किस अनुच्छेद में धन विधेयक की परिभाषा दी गई है?", "cEn": "Article 110", "cHi": "अनुच्छेद 110", "eEn": "Article 110 defines a Money Bill. A Money Bill can only be introduced in the Lok Sabha (not the Rajya Sabha) and requires the Speaker's certification. Article 109 deals with the special procedure for Money Bills; Article 112 with the Annual Financial Statement (Budget).", "eHi": "अनुच्छेद 110 धन विधेयक को परिभाषित करता है। एक धन विधेयक केवल लोक सभा में पेश किया जा सकता है (राज्य सभा में नहीं) और इसे अध्यक्ष के प्रमाणन की आवश्यकता होती है। अनुच्छेद 109 धन विधेयकों के लिए विशेष प्रक्रिया से संबंधित है; अनुच्छेद 112 वार्षिक वित्तीय विवरण (बजट) से।", "ref": "Article 110, Constitution of India", "opts": [{"en": "Article 109", "hi": "अनुच्छेद 109"}, {"en": "Article 110", "hi": "अनुच्छेद 110"}, {"en": "Article 111", "hi": "अनुच्छेद 111"}, {"en": "Article 112", "hi": "अनुच्छेद 112"}], "correct": 1},
  {"id": "POL-116", "section": "Union and its territory", "sub": "Admission of new states", "type": "mcq_single", "qEn": "Parliament may by law admit into the Union or establish new States under which Article?", "qHi": "संसद कानून द्वारा संघ में नए राज्यों को प्रवेश दे सकती है या नए राज्यों की स्थापना किस अनुच्छेद के तहत कर सकती है?", "cEn": "Article 2", "cHi": "अनुच्छेद 2", "eEn": "Article 2 provides that Parliament may by law admit into the Union or establish new States on such terms and conditions as it thinks fit. Article 3 deals with formation of new States and alteration of areas/boundaries/names of existing States.", "eHi": "अनुच्छेद 2 प्रदान करता है कि Parliament कानून द्वारा संघ में नए राज्यों को प्रवेश दे सकता है या नए राज्यों की स्थापना अपनी उचित शर्तों पर कर सकता है। अनुच्छेद 3 नए राज्यों के गठन तथा मौजूदा राज्यों के क्षेत्र/सीमाओं/नामों में परिवर्तन से संबंधित है।", "ref": "Articles 2, 3, Constitution of India", "opts": [{"en": "Article 1", "hi": "अनुच्छेद 1"}, {"en": "Article 2", "hi": "अनुच्छेद 2"}, {"en": "Article 3", "hi": "अनुच्छेद 3"}, {"en": "Article 4", "hi": "अनुच्छेद 4"}], "correct": 1}
];</script>
<script src="../assets/quiz.js"></script>
</body>
</html>
