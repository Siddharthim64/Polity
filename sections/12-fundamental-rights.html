  {"id": "POL-100", "section": "Fundamental Rights", "sub": "Right to Freedom (Article 19)", "type": "mcq_multi", "qEn": "Which of the following freedoms are protected under Article 19(1) of the Constitution?", "qHi": "संविधान के अनुच्छेद 19(1) के अंतर्गत निम्न में से कौन सी स्वतंत्रताएं संरक्षित हैं?", "cEn": "Freedom of speech and expression; Freedom to assemble peaceably and without arms; Freedom to move freely throughout India", "cHi": "बोलने और अभिव्यक्ति की स्वतंत्रता; शस्त्रहीन शांतिपूर्ण सभा करने की स्वतंत्रता; पूरे भारत में स्वतंत्र रूप से आवागमन की स्वतंत्रता", "eEn": "Article 19(1) protects six freedoms: (a) speech & expression, (b) assemble peaceably without arms, (c) form associations, (d) move freely, (e) reside and settle, (f) practise any profession. The right to property [19(1)(f)] was deleted by the 44th Amendment, 1978 and is now a constitutional right under Article 300A, not a Fundamental Right.", "eHi": "अनुच्छेद 19(1) छह स्वतंत्रताओं की रक्षा करता है: (क) भाषण एवं अभिव्यक्ति, (ख) शस्त्रहीन शांतिपूर्ण सभा, (ग) संघ बनाना, (घ) स्वतंत्र आवागमन, (ङ) निवास और बसना, (च) कोई भी व्यवसाय अपनाना। संपत्ति का अधिकार [19(1)(f)] 44वें संशोधन, 1978 द्वारा हटाया गया और अब अनुच्छेद 300A के तहत एक संवैधानिक अधिकार है, मूल अधिकार नहीं।", "ref": "Article 19, Constitution of India; 44th Amendment Act, 1978", "opts": [{"en": "Freedom of speech and expression", "hi": "बोलने और अभिव्यक्ति की स्वतंत्रता"}, {"en": "Freedom to assemble peaceably and without arms", "hi": "शस्त्रहीन शांतिपूर्ण सभा करने की स्वतंत्रता"}, {"en": "Freedom to acquire, hold and dispose of property", "hi": "संपत्ति अर्जित करने, धारण करने और निपटाने की स्वतंत्रता"}, {"en": "Freedom to move freely throughout India", "hi": "पूरे भारत में स्वतंत्र रूप से आवागमन की स्वतंत्रता"}], "correct": [0, 1, 3]},
  {"id": "POL-104", "section": "Fundamental Rights", "sub": "Right to Life and Personal Liberty (Article 21)", "type": "assertion_reason", "qEn": "Assertion: Article 21 guarantees the right to life and personal liberty.", "qHi": "अभिकथन: अनुच्छेद 21 जीवन और व्यक्तिगत स्वतंत्रता के अधिकार की गारंटी देता है।", "cEn": "Both Assertion and Reason are true, and Reason is the correct explanation of Assertion", "cHi": "दोनों अभिकथन और कारण सत्य हैं, और कारण अभिकथन की सही व्याख्या है", "eEn": "Article 21 states: 'No person shall be deprived of his life or personal liberty except according to procedure established by law.' The Supreme Court has held that 'life' includes the right to live with human dignity (e.g., Maneka Gandhi, Francis Coralie Mullin).", "eHi": "अनुच्छेद 21 कहता है: 'किसी भी व्यक्ति को उसके जीवन या व्यक्तिगत स्वतंत्रता से वंचित नहीं किया जाएगा, सिवाय विधि द्वारा स्थापित प्रक्रिया के अनुसार।' सर्वोच्च न्यायालय ने माना है कि 'जीवन' में मानवीय गरिमा के साथ जीने का अधिकार शामिल है (जैसे मेनका गांधी, फ्रांसिस कोरल मालिन मामले)।", "ref": "Article 21, Constitution of India; Maneka Gandhi v. Union of India (1978)", "assertionEn": "Assertion: Article 21 guarantees the right to life and personal liberty.", "assertionHi": "अभिकथन: अनुच्छेद 21 जीवन और व्यक्तिगत स्वतंत्रता के अधिकार की गारंटी देता है।", "reasonEn": "Reason: The right to life includes the right to live with human dignity.", "reasonHi": "कारण: जीवन के अधिकार में मानवीय गरिमा के साथ जीने का अधिकार शामिल है।", "opts": [{"en": "Both A and R are true and R is the correct explanation of A", "hi": "A और R दोनों सत्य हैं और R, A की सही व्याख्या है"}, {"en": "Both A and R are true but R is NOT the correct explanation of A", "hi": "A और R दोनों सत्य हैं परंतु R, A की सही व्याख्या नहीं है"}, {"en": "A is true but R is false", "hi": "A सत्य है परंतु R असत्य है"}, {"en": "A is false but R is true", "hi": "A असत्य है परंतु R सत्य है"}, {"en": "Both A and R are false", "hi": "A और R दोनों असत्य हैं"}], "correct": 0},
  {"id": "POL-112", "section": "Fundamental Rights", "sub": "Right to Constitutional Remedies (Article 32)", "type": "mcq_single", "qEn": "Article 32 of the Constitution is popularly known as:", "qHi": "संविधान का अनुच्छेद 32 लोकप्रिय रूप से किस रूप में जाना जाता है?", "cEn": "The heart and soul of the Constitution", "cHi": "संविधान की आत्मा और हृदय", "eEn": "Dr. B.R. Ambedkar called Article 32 'the very soul of the Constitution and the very heart of it' because it provides the right to move the Supreme Court for enforcement of Fundamental Rights.", "eHi": "डॉ. बी.आर. आंबेडकर ने अनुच्छेद 32 को 'संविधान की आत्मा और इसका हृदय' कहा क्योंकि यह मूल अधिकारों के प्रवर्तन के लिए सर्वोच्च न्यायालय जाने का अधिकार प्रदान करता है।", "ref": "Article 32, Constitution of India", "opts": [{"en": "A dead letter", "hi": "एक मृत प्रावधान"}, {"en": "The most controversial article", "hi": "सबसे विवादास्पद अनुच्छेद"}, {"en": "A directive principle", "hi": "एक नीति निदेशक तत्व"}, {"en": "The heart and soul of the Constitution", "hi": "संविधान की आत्मा और हृदय"}], "correct": 3}
